<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Иконка на главном экране — логотип вуза, контрастный к фону: белый знак на
       чёрном в тёмной теме телефона, чёрный на белом — в светлой. iPhone берёт
       иконку в момент добавления. Картинки /brand/* сервер отдаёт из папки вуза,
       а на адресе Para — из server/hub (знак Para). -->
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-dark.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-light.png" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="{{URL}}/" />

  <!-- Карточка ссылки в Telegram и соцсетях. {{…}} подставляет сервер (server/src/site.js)
       из tenant.json вуза, на чей адрес пришли. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="{{URL}}/" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />

  <!-- С 2024 года Chrome прячет модель Android-устройства в обычном User-Agent
       (пишет заглушку "K") — настоящую отдаёт только через Client Hints, и только
       если сайт явно попросил. Эта строка — просьба; заголовок Sec-CH-UA-Model
       после неё начинает приходить на все запросы с этой страницы, включая /api/hit. -->
  <meta http-equiv="Accept-CH" content="Sec-CH-UA-Model, Sec-CH-UA-Platform-Version" />
  <title>{{TITLE}}</title>

  <!-- Бренд вуза для интерфейса (см. src/brand.ts). -->
  <script id="brand" type="application/json">{{BRAND_JSON}}</script>
</head>
<body>
  <!-- Экран запуска. Рисуется до загрузки сборки, поэтому вся разметка и стили — здесь.
       Цвет и знак те же, что на заставке Android-приложения (android/app/.../splash.png),
       поэтому переход из заставки в приложение не виден: кольцо просто начинает крутиться.
       Убирает его lib/boot.ts, когда на экране появляется расписание. -->
  <style>
    html{background:#000}
    #boot{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;
      transition:opacity .3s ease}
    #boot.is-done{opacity:0;pointer-events:none}
    /* Ширина знака подогнана под заставку Android: она рисует иконку 300dp,
       сам знак внутри неё — примерно 140dp. Тогда переход не «прыгает». */
    #boot svg{width:min(40vw,140px);height:auto}
    #boot .boot__ring{transform-box:view-box;transform-origin:500px 440px;
      animation:boot-spin 1.6s linear infinite}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot .boot__ring{animation:none}}
  </style>
  <div id="boot" aria-hidden="true">
    <svg viewBox="188 128 624 758" fill="none">
      <rect x="188" y="440" width="119" height="446" rx="59.5" fill="#fff" />
      <rect x="188" y="440" width="119" height="70" fill="#fff" />
      <circle cx="500" cy="440" r="252.5" stroke="#fff" stroke-width="119" />
      <g class="boot__ring">
        <circle cx="500" cy="440" r="252.5" stroke="#0A84FF" stroke-width="119" stroke-linecap="round"
          stroke-dasharray="489 1098" transform="rotate(-100 500 440)" />
      </g>
    </svg>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
